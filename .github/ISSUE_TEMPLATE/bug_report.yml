name: Bug report
description: Report a bug in Sensorium
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before you file this, please:
        - Check the [existing issues](https://github.com/The-Sensorium/sensorium/issues) for a duplicate.
        - Read the [contributing guide](../../blob/main/CONTRIBUTING.md).
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS you were using, and where (local dev, preview, production).
      placeholder: e.g. Chrome 126 on macOS 14, local dev via `supabase start`
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do you trigger the bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste error messages and relevant console output if available.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may be relevant.
