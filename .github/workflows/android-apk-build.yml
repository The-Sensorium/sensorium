name: Android APK (CI build)

# Builds an installable debug-signed release APK in CI (no EAS, no local
# machine). Runs prebuild + Gradle on a Linux runner, which sidesteps the
# Windows CMake/ninja instability entirely, then uploads the APK as an
# artifact you can download and side-load on a phone.
#
# One reusable workflow, two environments: pick `staging` or `production`
# when you run it. The EXPO_PUBLIC_* env vars are read per-environment from
# GitHub Actions repository variables named with that suffix, e.g.
#   EXPO_PUBLIC_SUPABASE_URL_staging / EXPO_PUBLIC_SUPABASE_URL_production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for EXPO_PUBLIC_* env vars'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      distribute:
        description: 'Also upload the APK to Firebase App Distribution'
        required: false
        default: false
        type: boolean
      tester-group:
        description: 'App Distribution tester group alias (needs distribute)'
        required: false
        default: beta
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars[format('EXPO_PUBLIC_SUPABASE_URL_{0}', inputs.environment)] }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars[format('EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY_{0}', inputs.environment)] }}
      EXPO_PUBLIC_KLIPY_APP_KEY: ${{ vars[format('EXPO_PUBLIC_KLIPY_APP_KEY_{0}', inputs.environment)] }}
      EXPO_PUBLIC_KLIPY_ENDPOINT: ${{ vars[format('EXPO_PUBLIC_KLIPY_ENDPOINT_{0}', inputs.environment)] }}
      EXPO_PUBLIC_WEB_URL: ${{ vars[format('EXPO_PUBLIC_WEB_URL_{0}', inputs.environment)] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Restore google-services.json from secret
        working-directory: mobile
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > google-services.json
        shell: bash

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for CI release
        # Prebuild regenerates mobile/android from the Expo template, so patch
        # the generated gradle.properties here rather than committing android/.
        # Release APKs only need ARM ABIs; x86/x86_64 are emulator-only and
        # double native build time plus packaging memory. 2g/512m OOMs in
        # :app:packageRelease (see IncrementalSplitterRunnable failure).
        working-directory: mobile/android
        run: |
          sed -i "s/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/" gradle.properties
          sed -i "s/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/" gradle.properties
          cat gradle.properties
        shell: bash

      - name: Install project NDK
        run: yes | sdkmanager "ndk;27.1.12297006" 2>/dev/null || true

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew app:assembleRelease -x lint --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sensorium-${{ inputs.environment }}-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Distribute via Firebase App Distribution
        # Opt-in: run the workflow with distribute=true. Requires the
        # FIREBASE_SERVICE_ACCOUNT_JSON secret (base64-encoded service-account
        # key with the Firebase App Distribution Admin role) and an existing
        # tester group alias passed as tester-group.
        if: inputs.distribute
        working-directory: mobile
        env:
          # Firebase App ID for online.thesensorium.app (public identifier,
          # also in google-services.json as mobilesdk_app_id).
          FIREBASE_APP_ID: 1:805748164368:android:0fb45f0d0d295dcfbd4795
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is not set."
            echo "Create a service account with the Firebase App Distribution Admin role,"
            echo "add its JSON key (base64-encoded) as that secret, then rerun."
            exit 1
          fi
          npm i -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "${{ inputs.tester-group }}" \
            --release-notes "Sensorium ${{ inputs.environment }} beta (${{ github.sha }})"
        shell: bash