name: Mobile CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'docs/**']
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

  # Optional manual run so you can exercise the pipeline on demand.
  workflow_dispatch:

# Cancel superseded runs in the same group; do not cancel across branches.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: typecheck · lint · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npx oxlint

      - name: Expo doctor
        run: npx expo-doctor

      - name: Bundle (Android production check)
        run: npx expo export --platform android --output-dir dist-check --clear
