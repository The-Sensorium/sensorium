name: Migrate Staging

# Applies pending migrations to the STAGING Supabase project whenever code
# lands on `develop`. Feature branches never apply migrations directly; their
# migration SQL is applied here, on the develop merge, after PR review.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link staging Supabase project
        run: npx supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Apply migrations to staging
        run: npx supabase db push --linked --password "$SUPABASE_STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Deploy send-emails edge function to staging
        run: npx supabase functions deploy send-emails --project-ref "$SUPABASE_STAGING_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Set email secrets on staging edge function
        run: >-
          npx supabase secrets set
          --project-ref "$SUPABASE_STAGING_PROJECT_ID"
          RESEND_API_KEY="$RESEND_API_KEY"
          RESEND_FROM="no-reply@thesensorium.online"
          SENSORIUM_EMAIL_SECRET="$SENSORIUM_EMAIL_SECRET"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENSORIUM_EMAIL_SECRET: ${{ secrets.SENSORIUM_EMAIL_SECRET }}

      - name: Point the DB cron at the staging edge function
        run: >-
          npx supabase db query --linked
          "update public.email_settings
             set edge_url = 'https://$SUPABASE_STAGING_PROJECT_ID.functions.supabase.co/send-emails',
                 secret = '$SENSORIUM_EMAIL_SECRET',
                 app_url = 'https://preview.thesensorium.online',
                 enabled = true,
                 updated_at = now();"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SENSORIUM_EMAIL_SECRET: ${{ secrets.SENSORIUM_EMAIL_SECRET }}
