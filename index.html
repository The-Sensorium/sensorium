<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" data-favicon="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" data-favicon="dark" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" media="(prefers-color-scheme: light)" data-favicon="light" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-dark-96x96.png" media="(prefers-color-scheme: dark)" data-favicon="dark" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" media="(prefers-color-scheme: light)" data-favicon="light" />
    <link rel="icon" type="image/x-icon" href="/favicon-dark.ico" media="(prefers-color-scheme: dark)" data-favicon="dark" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- interactive-widget=resizes-content makes Chrome shrink the layout
         viewport when the on-screen keyboard opens, so 100dvh and the fixed
         bottom nav stay aligned and the chat composer sits flush above the
         keys (Chrome 108+; Safari ignores it and keeps its default). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fff8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('sensorium:theme')
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var mode = dark ? 'dark' : 'light'
          var links = document.querySelectorAll('link[rel="icon"][data-favicon]')
          for (var i = 0; i < links.length; i++) {
            links[i].media = links[i].getAttribute('data-favicon') === mode ? 'all' : 'not all'
          }
        } catch (error) {}
      })()
    </script>
    <meta
      name="description"
      content="Sensorium. Eight strangers. One cluster. Build meaningful friendships through small permanent groups."
    />
    <title>Sensorium - Eight strangers. One cluster.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
